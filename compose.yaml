services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: candidatelens
      POSTGRES_PASSWORD: candidatelens
      POSTGRES_DB: candidatelens
    ports:
      - "5432:5432"
    volumes:
      - candidatelens_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candidatelens -d candidatelens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  candidatelens_db_data:
